# Builds the Windows installer (Setup .exe), a portable .exe and a .zip on a real Windows machine.
# Run it from GitHub: Actions → "Build Windows installer" → Run workflow, then download the files
# from the run's "Artifacts". Pushing a tag like v1.0.1 also publishes them as a GitHub Release.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      allow_demo_key:
        description: "Test build with the DEMO licence key (never give this build to customers)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          ALLOW_DEMO_KEY: ${{ inputs.allow_demo_key && '1' || '0' }}
      - name: Package
        run: npx electron-builder --win nsis portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: innvela-hotel-desk-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
